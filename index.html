<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Triumph Task Manager</title>

    <!-- Google Font -->

    <link
       href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
       rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
       href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
       href="css/style.css">

</head>

<body>

<div class="container">

    <div class="todo-box">


        <div class="theme-toggle">

    <button
        id="themeToggle"
        aria-label="Switch to dark mode"
        title="Switch to dark mode">

        <i
            class="fa-solid fa-moon"
            aria-hidden="true">
        </i>

    </button>

</div>



       
        <h1>
            <i class="fa-solid fa-list-check"></i>
            Triumph Task Manager
        </h1>

        <p>
            Organize your day and stay productive.
        </p>

        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task...">

            <button id="addTask">

                <i class="fa-solid fa-plus"></i>

            </button>

        </div>

<div class="task-info">

    <span id="taskCount">
        0 Tasks
    </span>

    <span id="completedCount">
        0 Completed
    </span>

    <span id="pendingCount">
        0 Pending
    </span>

</div>

<div class="task-filters">

    <button
        class="filter-btn active"
        data-filter="all">
        All
    </button>

    <button
        class="filter-btn"
        data-filter="active">
        Active
    </button>

    <button
        class="filter-btn"
        data-filter="completed">
        Completed
    </button>

</div>



<div class="search-box">

    <i
        class="fa-solid fa-magnifying-glass"
        aria-hidden="true">
    </i>

    <input
        type="search"
        id="searchInput"
        placeholder="Search tasks..."
        aria-label="Search tasks">

</div>


<ul id="taskList"></ul>
    </div>



    <!-- ======================================
         Edit Task Modal
    ======================================= -->

    <div
        class="modal"
        id="editModal"
        aria-hidden="true">

        <div class="modal-content">

            <button
                class="modal-close"
                id="closeModal"
                aria-label="Close edit task modal">

                <i
                    class="fa-solid fa-xmark"
                    aria-hidden="true">
                </i>

            </button>

            <h2>Edit Task</h2>

            <p>Update your task below.</p>

            <label for="editTaskInput">
                Task name
            </label>

            <input
                type="text"
                id="editTaskInput"
                placeholder="Enter task name...">

            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelEdit">

                    Cancel

                </button>

                <button
                    type="button"
                    class="save-btn"
                    id="saveEdit">

                    Save Changes

                </button>

            </div>

        </div>

    </div>





<!-- ======================================
     Delete Task Modal
======================================= -->

<div
    class="modal"
    id="deleteModal"
    aria-hidden="true">

    <div class="modal-content delete-modal-content">

        <button
            class="modal-close"
            id="closeDeleteModal"
            aria-label="Close delete confirmation">

            <i
                class="fa-solid fa-xmark"
                aria-hidden="true">
            </i>

        </button>

        <div class="delete-icon">

            <i
                class="fa-solid fa-trash"
                aria-hidden="true">
            </i>

        </div>

        <h2>Delete Task?</h2>

        <p>
            Are you sure you want to delete this task?
            This action cannot be undone.
        </p>

        <div class="modal-actions">

            <button
                type="button"
                class="cancel-btn"
                id="cancelDelete">

                Cancel

            </button>

            <button
                type="button"
                class="delete-confirm-btn"
                id="confirmDelete">

                Delete Task

            </button>

        </div>

    </div>

</div>




</div>

<script src="js/script.js"></script>

</body>
</html>
